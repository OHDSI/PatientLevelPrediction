# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '**'

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}  
          - {os: macOS-latest, r: 'release'}
          - {os: ubuntu-24.04, r: 'release', rspm: "https://packagemanager.rstudio.com/cran/__linux__/noble/latest"}

    env:
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      _R_CHECK_DONTTEST_EXAMPLES_: "false"
      EUNOMIA_DATA_FOLDER: ${{ github.workspace }}/.cache/eunomia
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      CDM5_ORACLE_CDM_SCHEMA: ${{ secrets.CDM5_ORACLE_CDM_SCHEMA }}
      CDM5_ORACLE_OHDSI_SCHEMA: ${{ secrets.CDM5_ORACLE_OHDSI_SCHEMA }}
      CDM5_ORACLE_PASSWORD: ${{ secrets.CDM5_ORACLE_PASSWORD }}
      CDM5_ORACLE_SERVER: ${{ secrets.CDM5_ORACLE_SERVER }}
      CDM5_ORACLE_USER: ${{ secrets.CDM5_ORACLE_USER }}
      CDM5_POSTGRESQL_CDM_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_CDM_SCHEMA }}
      CDM5_POSTGRESQL_OHDSI_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_OHDSI_SCHEMA }}
      CDM5_POSTGRESQL_PASSWORD: ${{ secrets.CDM5_POSTGRESQL_PASSWORD }}
      CDM5_POSTGRESQL_SERVER: ${{ secrets.CDM5_POSTGRESQL_SERVER }}
      CDM5_POSTGRESQL_USER: ${{ secrets.CDM5_POSTGRESQL_USER }}
      CDM5_SQL_SERVER_CDM_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_CDM_SCHEMA }}
      CDM5_SQL_SERVER_OHDSI_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_OHDSI_SCHEMA }}
      CDM5_SQL_SERVER_PASSWORD: ${{ secrets.CDM5_SQL_SERVER_PASSWORD }}
      CDM5_SQL_SERVER_SERVER: ${{ secrets.CDM5_SQL_SERVER_SERVER }}
      CDM5_SQL_SERVER_USER: ${{ secrets.CDM5_SQL_SERVER_USER }}      
      RETICULATE_PY_VERSION: 3.11

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-pandoc@v2 

      - name: Install system requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libssh-dev
          Rscript -e 'install.packages("remotes")'
          while read -r cmd
          do
            eval sudo $cmd
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "24.04"))')
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: any::rcmdcheck
          needs: check

      - name: Prepare Eunomia dataset cache
        run: |
          dir.create(Sys.getenv("EUNOMIA_DATA_FOLDER"), recursive = TRUE, showWarnings = FALSE)
        shell: Rscript {0}

      - name: Cache Eunomia datasets
        uses: actions/cache@v5
        with:
          path: ${{ env.EUNOMIA_DATA_FOLDER }}
          key: eunomia-v1-${{ runner.os }}-GiBleed_5.3

      - name: Prepare uv cache
        run: |
          dir.create(Sys.getenv("UV_CACHE_DIR"), recursive = TRUE, showWarnings = FALSE)
        shell: Rscript {0}

      - name: Cache uv (reticulate::py_require)
        uses: actions/cache@v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-v1-${{ runner.os }}-py${{ env.RETICULATE_PY_VERSION }}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          check-dir: '"check"'

      - name: Upload source package
        if: success() && runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package_tarball
          path: check/*.tar.gz
          
      - name: Install covr
        if: >-
          runner.os == 'macOS' &&
          (
            (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')) ||
            (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
          )
        run: |
          install.packages("remotes")
          remotes::install_cran("covr")
        shell: Rscript {0}
        
      - name: Test coverage
        if: >-
          runner.os == 'macOS' &&
          (
            (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')) ||
            (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
          )
        run: covr::codecov(token = "${{ secrets.CODECOV_TOKEN }}")
        shell: Rscript {0}

  release_metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.metadata.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2

      - name: Test semantic version handling
        run: Rscript .github/scripts/releaseMetadata.R --self-test

      - name: Validate version and NEWS
        id: metadata
        run: Rscript .github/scripts/releaseMetadata.R "$GITHUB_OUTPUT" release-notes.md

      - name: Summarize release detection
        run: |
          echo "Package version: ${{ steps.metadata.outputs.package_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest tag: ${{ steps.metadata.outputs.latest_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "New release: ${{ steps.metadata.outputs.new_version || 'none' }}" >> "$GITHUB_STEP_SUMMARY"

  Release:
    needs: [R-CMD-check, release_metadata]
    runs-on: macOS-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release_metadata.outputs.new_version }}
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.release_metadata.outputs.new_version != ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2

      - name: Recreate validated release notes
        run: Rscript .github/scripts/releaseMetadata.R "$GITHUB_OUTPUT" release-notes.md

      - name: Install drat
        run: install.packages("drat")
        shell: Rscript {0}

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package_tarball
          path: dist

      - name: Locate checked source package
        run: |
          tarballs=(dist/PatientLevelPrediction_*.tar.gz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one source package, found ${#tarballs[@]}" >&2
            exit 1
          fi
          echo "PACKAGE_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"
        shell: bash

      - name: Create or refresh draft release
        id: draft_release
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$state" != "true" ]]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release edit "$RELEASE_TAG" --title "Release $RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "$PACKAGE_TARBALL" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_TARBALL" \
              --draft \
              --title "Release $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Push to drat
        if: steps.draft_release.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash deploy.sh

      - name: Push to BroadSea
        if: steps.draft_release.outputs.already_published != 'true'
        env:
          BROADSEA_TRIGGER_URL: ${{ secrets.BROADSEA_TRIGGER_URL }}
        run: curl --fail --show-error --silent --data "build=true" -X POST "$BROADSEA_TRIGGER_URL"

      - name: Publish GitHub release
        if: steps.draft_release.outputs.already_published != 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false
